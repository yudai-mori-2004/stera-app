# http-context drop-in: raises the request body ceiling for ALL server blocks.
#
# Copy to: /etc/nginx/conf.d/client-max-body-size.conf
# Then:    sudo nginx -t && sudo systemctl reload nginx
#
# Why a standalone file instead of editing the vhost conf:
#   - `certbot --nginx` rewrites the domain conf in place to add the 443/ssl
#     block, so a limit set only in the port-80 server block may not be
#     inherited by (or may be clobbered relative to) the HTTPS block.
#   - Files in conf.d/ are included inside nginx's `http {}` context, so a bare
#     directive here becomes the global default that every server/location
#     inherits — HTTP and HTTPS alike — and survives future certbot runs.
#
# The backend only ever receives JSON metadata (file bytes go straight to R2 via
# presigned URLs). The largest legitimate body is /multipart/complete, whose
# parts[] array holds up to 10,000 {ETag, PartNumber} entries (~700 KB). 16 MB is
# generous headroom while still rejecting genuinely abusive payloads.
client_max_body_size 16m;
