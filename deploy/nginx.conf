# Nginx virtual host for stera-open API
# Copy to: /etc/nginx/conf.d/app-dev.rootlens.io.conf
# Then run: sudo certbot --nginx -d app-dev.rootlens.io

server {
    listen 80;
    server_name app-dev.rootlens.io;

    # File bytes go straight to R2 via presigned URLs — the backend only ever
    # receives JSON metadata. The largest legitimate body is /multipart/complete,
    # whose parts[] array holds up to 10,000 {ETag, PartNumber} entries (~700 KB).
    client_max_body_size 16m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
