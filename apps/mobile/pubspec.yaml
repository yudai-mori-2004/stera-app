name: stera
description: "infra for spatial intelligence"
publish_to: "none"
version: 0.2.0+66

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^3.3.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  device_info_plus: ">=12.0.0 <12.4.0"
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^22.1.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.0.7
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  intl: ^0.20.2
  motor: ^1.1.0
  network_info_plus: ^7.0.0
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  provider: ^6.1.1
  pub_semver: ^2.2.0
  rxdart: ^0.28.0
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^8.1.0
  solar_icons: ^0.1.0
  better_auth_flutter: ^0.1.0
  toastification: ^3.0.3
  upgrader: ^13.6.0
  url_launcher: ^6.2.2
  uuid: ^4.4.0
  video_player: ^2.8.2
  wakelock_plus: ^1.4.0
  stera_recorder:
    path: ../../packages/stera_recorder

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.10.4
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/images/ui/
    - assets/fonts/
    - assets/icon/
    - assets/icon/nav_bar/

  # brand:fonts:start
  # Generated by packages/brand/apply.ts from packages/brand/brand.json - edit that, not this.
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-VariableFont_wght.ttf
        - asset: assets/fonts/EBGaramond-Italic-VariableFont_wght.ttf
          style: italic
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-VariableFont_wght.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-VariableFont_wght.ttf
    - family: Handjet
      fonts:
        - asset: assets/fonts/Handjet-VariableFont_ELGR,ELSH,wght.ttf
    - family: GeistExtraBold
      fonts:
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
  # brand:fonts:end
# brand:launcher-icons:start
# Generated by packages/brand/apply.ts from packages/brand/brand.json - edit that, not this.
flutter_launcher_icons:
  image_path: "../../packages/brand/generated/icon_1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../../packages/brand/generated/icon_foreground_1024.png"
  adaptive_icon_monochrome: "../../packages/brand/generated/icon_monochrome_1024.png"
# brand:launcher-icons:end
